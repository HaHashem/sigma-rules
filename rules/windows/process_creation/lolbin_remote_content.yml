title: Signed Binary Proxy Execution With Remote Content
id: e2beaffc-f198-5692-b353-5ba30fba0691
status: experimental
description: Detects living-off-the-land binaries invoked with a URL or script scheme to fetch or run
  remote content.
author: Hashem H. Hashem
date: '2026-10-02'
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_mshta:
    Image|endswith: \mshta.exe
    CommandLine|contains:
    - http://
    - https://
    - 'javascript:'
    - 'vbscript:'
  selection_regsvr:
    Image|endswith: \regsvr32.exe
    CommandLine|contains:
    - /i:http
    - scrobj.dll
  selection_rundll:
    Image|endswith: \rundll32.exe
    CommandLine|contains:
    - 'javascript:'
    - \\
  selection_certutil:
    Image|endswith: \certutil.exe
    CommandLine|contains:
    - -urlcache
    - -decode
    - -encode
  selection_bits:
    Image|endswith: \bitsadmin.exe
    CommandLine|contains: /transfer
  selection_msi:
    Image|endswith: \msiexec.exe
    CommandLine|contains:
    - http://
    - https://
  condition: 1 of selection_*
falsepositives:
- Software deployment
- Legitimate use of certutil for certificate work
level: medium
