title: Microsoft Defender Tampering Commands
id: 1c81418d-1754-5a05-a060-5b5ffc3f4175
status: experimental
description: Detects commands that disable Defender protection or add exclusions.
author: Hashem H. Hashem
date: '2026-10-02'
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - Set-MpPreference -DisableRealtimeMonitoring
    - Set-MpPreference -DisableIOAVProtection
    - Add-MpPreference -ExclusionPath
    - Add-MpPreference -ExclusionExtension
    - DisableAntiSpyware
    - DisableRealtimeMonitoring
  condition: selection
falsepositives:
- Administrators adding approved exclusions for software
level: high
