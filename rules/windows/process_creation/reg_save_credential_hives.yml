title: Registry Hive Save of SAM, SYSTEM or SECURITY
id: da7871d8-1c94-5f15-8adf-6a5d917dda58
status: experimental
description: Detects reg.exe saving credential-bearing hives to files.
author: Hashem H. Hashem
date: '2026-10-02'
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: \reg.exe
  selection_cli:
    CommandLine|contains:
    - save hklm\sam
    - save hklm\system
    - save hklm\security
    - save hkey_local_machine\sam
    - save hkey_local_machine\system
  condition: selection_img and selection_cli
falsepositives:
- Backup or imaging tools
level: high
