title: PowerShell Encoded or Hidden Command
id: 05b7aa80-0f1b-53f6-b062-012c44faf01b
status: experimental
description: Detects PowerShell launched with an encoded command, or hidden window with no profile, often
  used to hide payloads.
author: Hashem H. Hashem
date: '2026-10-02'
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_enc:
    CommandLine|contains:
    - ' -enc '
    - ' -e '
    - ' -encodedcommand '
    - ' -ec '
  selection_hidden:
    CommandLine|contains|all:
    - -w
    - hidden
  selection_noprof:
    CommandLine|contains:
    - '-nop '
    - -noprofile
  condition: selection_img and (selection_enc or (selection_hidden and selection_noprof))
falsepositives:
- Management tools and installers that use encoded commands
level: medium
